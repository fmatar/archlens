name: Publish Docker Image & Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. 0.0.1-Alpha-02)'
        required: false
        default: '0.0.1-Alpha-02'

permissions:
  contents: write
  packages: write

jobs:
  docker-release:
    name: Build Multi-Arch Docker Image & Publish to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build Unified Application Package
        run: |
          npm --prefix frontend install
          npm --prefix frontend run build
          mvn -B -ntp package -DskipTests
          tar -czf "backend/target/archlens-${{ github.ref_name }}-runner.tar.gz" -C backend/target quarkus-app

      - name: Set up QEMU (Multi-Arch)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}
            type=sha

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Archlens Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'Alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'Beta') || contains(github.ref_name, 'rc') }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            backend/target/archlens-backend-*.jar
            backend/target/archlens-*-runner.tar.gz
            backend/target/bom.json
            backend/target/bom.xml
            media/archlens-teaser.mp4

  npm-release:
    name: Test and Publish NPM CLI Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Run CLI Tests
        run: |
          npm --prefix cli test

      - name: Publish @fmatar/archlens-skill to NPM
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            npm --prefix cli publish --access public
          else
            echo "NPM_TOKEN secret not configured; skipping public npm publish."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

