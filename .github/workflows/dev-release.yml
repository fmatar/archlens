name: Development Track (Canary) Release

on:
  push:
    branches:
      - develop
    paths-ignore:
      - '**.md'
      - 'media/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: dev-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dev-docker:
    name: Build & Publish Canary Docker Image (:dev)
    runs-on: local-archlens

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Build Toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cache-pnpm: 'true'

      - name: Build and Push Canary Multi-Arch Container Image (Quarkus Jib)
        env:
          GHCR_PASSWORD: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          mvn -B -ntp package -DskipTests \
            -Dquarkus.container-image.build=true \
            -Dquarkus.container-image.push=true \
            -Dquarkus.container-image.registry=ghcr.io \
            -Dquarkus.container-image.group=${{ github.repository_owner }} \
            -Dquarkus.container-image.name=archlens \
            -Dquarkus.container-image.username=${{ github.actor }} \
            -Dquarkus.container-image.password="${GHCR_PASSWORD}" \
            -Dquarkus.container-image.tag="dev" \
            -Dquarkus.container-image.additional-tags="dev-${GITHUB_SHA::7}"

  dev-npm:
    name: Build & Publish Canary NPM Package (@dev)
    runs-on: local-archlens

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js (Latest LTS)
        uses: ./.github/actions/setup-toolchain
        with:
          setup-java: 'false'
          setup-maven: 'false'
          registry-url: 'https://registry.npmjs.org'

      - name: Run CLI Tests
        run: |
          npm --prefix cli test

      - name: Prepare Canary Prerelease Version
        id: versioning
        run: |
          BASE_VERSION=$(node -p "require('./cli/package.json').version.split('-')[0]")
          DEV_VERSION="${BASE_VERSION}-dev.${{ github.run_number }}"
          echo "Setting package version to ${DEV_VERSION}"
          npm --prefix cli version "${DEV_VERSION}" --no-git-tag-version
          echo "canary_version=${DEV_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Pack Canary Package
        id: pack
        run: |
          npm pack ./cli --pack-destination cli
          TARBALL_PATH=$(ls ./cli/fmatar-archlens-skill-*.tgz | head -n 1)
          echo "tarball=${TARBALL_PATH}" >> "$GITHUB_OUTPUT"

      # npm rejects --provenance (and Trusted Publishing/OIDC) from self-hosted runners,
      # and actions/setup-node overrides ~/.npmrc via NPM_CONFIG_USERCONFIG, so each
      # registry gets an explicit userconfig and failures are no longer swallowed.
      - name: Publish Canary to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NPMRC="${RUNNER_TEMP}/.npmrc-ghpkg"
          printf '@fmatar:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}\n' > "$NPMRC"
          export NPM_CONFIG_USERCONFIG="$NPMRC"
          npm publish "${{ steps.pack.outputs.tarball }}" --registry=https://npm.pkg.github.com --tag dev

      - name: Publish Canary to Public NPM Registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN secret is not set; cannot publish canary to registry.npmjs.org."
            exit 1
          fi
          NPMRC="${RUNNER_TEMP}/.npmrc-npmjs"
          printf '@fmatar:registry=https://registry.npmjs.org/\n//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}\n' > "$NPMRC"
          export NPM_CONFIG_USERCONFIG="$NPMRC"
          npm publish "${{ steps.pack.outputs.tarball }}" --access public --tag dev --registry=https://registry.npmjs.org/
