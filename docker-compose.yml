services:
  archlens:
    image: ghcr.io/fmatar/archlens:latest
    container_name: archlens
    ports:
      # Loopback only: the workbench must not be reachable from other machines (#224)
      - "127.0.0.1:8088:8088"
    environment:
      # Session token for /api and /mcp (#225). Leave unset to let the server generate one and read
      # it from ~/.archlens/session-8088.json (or set ARCHLENS_LOG_TOKEN=true to log the token URL).
      - ARCHLENS_TOKEN=${ARCHLENS_TOKEN:-}
      - ARCHLENS_LOG_TOKEN=${ARCHLENS_LOG_TOKEN:-false}
      - PROJECT_ROOT=${PROJECT_ROOT:-/workspace}
      - JAVA_OPTS=-Xms128m -Xmx512m
    volumes:
      # Mount your project or workspace root so repositories can be analyzed dynamically
      - ${WORKSPACE_ROOT:-./}:/workspace:ro
      # Optional read-write mount for active project cache & mailbox queues
      - ${ACTIVE_PROJECT_CACHE:-./.archlens}:/workspace/.archlens:rw
    restart: unless-stopped
