name: Scheduled Dependency Pulse & Safe Upgrades

on:
  schedule:
    - cron: '0 3 * * 1' # Runs every Monday at 03:00 UTC
  workflow_dispatch:
    inputs:
      allow_major:
        description: 'Allow major semver version updates'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependency-pulse
  cancel-in-progress: true

jobs:
  audit-and-update:
    name: Audit & Safe Dependency Updates
    runs-on: local-archlens

    steps:
      - name: Checkout develop branch
        uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0

      - name: Set up Build Toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cache-pnpm: 'true'

      - name: Run Safe Dependency Governance Engine
        id: update_deps
        run: |
          FLAGS="--safe"
          if [ "${{ inputs.allow_major }}" = "true" ]; then
            FLAGS="${FLAGS} --major"
          fi
          node scripts/update-dependencies.js $FLAGS

      - name: Inspect Git Working Tree
        id: git_status
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected across manifests."
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "Zero manifest changes detected. Dependencies remain up to date."
          fi

      # The self-hosted runner image has no GitHub CLI (#234).
      - name: Ensure GitHub CLI
        if: steps.git_status.outputs.has_changes == 'true'
        run: bash scripts/ensure-gh.sh

      - name: Create or Update Pull Request for Safe Upgrades
        if: steps.git_status.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # One reusable branch: re-runs update the open PR instead of leaving orphan branches.
          BRANCH_NAME="chore/dependency-pulse"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH_NAME"
          git add pom.xml backend/pom.xml frontend/pom.xml cli/pom.xml package.json cli/package.json frontend/package.json frontend/pnpm-lock.yaml
          git commit -m "chore(deps): safe dependency pulse updates" -m "Automated safe dependency governance update verified regression-free via Dual-Gate test suite."
          git push --force origin "$BRANCH_NAME"

          PR_BODY=$(cat << 'EOF_BODY'
          ## Safe Dependency Pulse Update Summary

          This automated pull request applies verified safe dependency updates across Maven and NPM manifests.

          ### Verification Matrix
          - All updates were filtered to exclude unstable pre-release builds (Alpha, Beta, CR, RC, dev).
          - Full Dual-Gate verification suite passed regression-free prior to commit:
            - Spotless code hygiene
            - Svelte check & TypeScript diagnostics
            - Vitest frontend tests
            - JUnit backend tests
            - Node CLI tests
          EOF_BODY
          )

          LABEL_ARGS=()
          if gh label list --limit 200 --json name --jq '.[].name' | grep -qx "dependencies" \
            || gh label create "dependencies" --color "0366d6" --description "Dependency updates" >/dev/null 2>&1; then
            LABEL_ARGS=(--label "dependencies")
          else
            echo "::warning::Could not find or create the 'dependencies' label; opening the PR without it."
          fi

          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --base develop --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" --body "$PR_BODY" "${LABEL_ARGS[@]}"
            echo "Updated existing dependency pulse PR #${EXISTING_PR}."
          else
            gh pr create \
              --base develop \
              --head "$BRANCH_NAME" \
              --title "chore(deps): weekly safe dependency update" \
              --body "$PR_BODY" \
              "${LABEL_ARGS[@]}"
          fi
