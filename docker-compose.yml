services:
  uml-workbench:
    image: fmatar/uml-workbench:latest
    container_name: uml-workbench
    ports:
      - "8088:8088"
    environment:
      - PROJECT_ROOT=${PROJECT_ROOT:-/workspace/labs/unclebob-design}
      - JAVA_OPTS=-Xms128m -Xmx512m
    volumes:
      # Mount entire workspace root so any sibling project can be analyzed dynamically
      - ${WORKSPACE_ROOT:-/Users/fady/workspace}:/workspace:ro
      # Optional read-write mount for active project cache & mailbox queues
      - ${ACTIVE_PROJECT_CACHE:-/Users/fady/workspace/labs/unclebob-design/.uml-viewer}:/workspace/labs/unclebob-design/.uml-viewer:rw
    restart: unless-stopped
