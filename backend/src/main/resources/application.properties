quarkus.application.name=archlens
quarkus.http.port=8088
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${ARCHLENS_CORS_ORIGINS:http://localhost:5173,http://localhost:8088,http://127.0.0.1:8088}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS

# Jackson Build-Time Reflection-Free Serialization
quarkus.rest.jackson.optimization.enable-reflection-free-serializers=true

# Container Image Configuration (Daemonless Multi-Arch Jib)
quarkus.container-image.name=archlens
quarkus.container-image.group=${IMAGE_GROUP:fmatar}
quarkus.container-image.registry=${REGISTRY:ghcr.io}
quarkus.container-image.tag=${IMAGE_TAG:latest}
quarkus.container-image.build=${BUILD_CONTAINER:false}
quarkus.container-image.push=${PUSH_CONTAINER:false}
quarkus.jib.base-jvm-image=eclipse-temurin:25-jre-alpine
quarkus.jib.platforms=linux/amd64,linux/arm64
quarkus.jib.ports=8088
quarkus.jib.labels."org.opencontainers.image.title"=Archlens — Clean Architecture Dynamic Workbench
quarkus.jib.labels."org.opencontainers.image.description"=Interactive architecture workbench and autonomous AI refactoring companion
quarkus.jib.labels."org.opencontainers.image.source"=https://github.com/fmatar/archlens
quarkus.jib.labels."org.opencontainers.image.licenses"=Apache-2.0

# Model Context Protocol (MCP) Server Configuration
quarkus.mcp.server.http.root-path=/mcp
quarkus.mcp.server.server-info.name=archlens-mcp
quarkus.mcp.server.server-info.version=${quarkus.application.version:0.1.0-Beta-12}
quarkus.mcp.server.http.dns-rebinding-check.enabled=true
quarkus.mcp.server.http.streamable.lazy-sse-init=true

# Test Profile Port Isolation
%test.quarkus.http.test-port=0
