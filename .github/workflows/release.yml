name: Publish Docker Image & Production Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
    paths-ignore:
      - '*.md'
      - 'wiki/**'
      - 'media/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-ci-gate:
    name: Wait for CI & Quality Gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Enforce Safe Dispatch Ref
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ] && [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "::error::Manual release dispatch is restricted to main or v* tags (got ${GITHUB_REF})."
            exit 1
          fi

      - name: Wait for CI & Quality Gates on Commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/wait-for-ci-checks.js \
            --repo "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" \
            --check "Verify & Quality Gates" \
            --check "GitHub Action Self-Test (uses ./)"

  docker-release:
    name: Build Multi-Arch Docker Image & Publish to GHCR
    needs: [npm-release]
    runs-on: local-archlens
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Build Toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cache-pnpm: 'true'

      - name: Build and Push Multi-Arch Container Image (Quarkus Jib)
        env:
          GHCR_PASSWORD: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          REPO_OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
        run: |
          SHA_TAG="sha-${GITHUB_SHA::7}"
          REF_TAG="${REF_NAME}"
          if [ "$REF_TAG" = "main" ]; then
            PRIMARY_TAG="latest"
            EXTRA_TAGS="${SHA_TAG}"
          else
            CLEAN_VER="${REF_TAG#v}"
            PRIMARY_TAG="${REF_TAG}"
            EXTRA_TAGS="latest,${CLEAN_VER},${SHA_TAG}"
          fi
          mvn -B -ntp package -DskipTests \
            -Dquarkus.container-image.build=true \
            -Dquarkus.container-image.push=true \
            -Dquarkus.container-image.registry=ghcr.io \
            -Dquarkus.container-image.group="${REPO_OWNER}" \
            -Dquarkus.container-image.name=archlens \
            -Dquarkus.container-image.username="${ACTOR}" \
            -Dquarkus.container-image.password="${GHCR_PASSWORD}" \
            -Dquarkus.container-image.tag="${PRIMARY_TAG}" \
            -Dquarkus.container-image.additional-tags="${EXTRA_TAGS}"
          tar -czf "backend/target/archlens-${REF_NAME}-runner.tar.gz" -C backend/target quarkus-app

      - name: Publish Multi-Arch Container Image to Docker Hub (Optional)
        if: env.DOCKERHUB_TOKEN != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || github.repository_owner }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          SHA_TAG="sha-${GITHUB_SHA::7}"
          REF_TAG="${REF_NAME}"
          if [ "$REF_TAG" = "main" ]; then
            PRIMARY_TAG="latest"
            EXTRA_TAGS="${SHA_TAG}"
          else
            CLEAN_VER="${REF_TAG#v}"
            PRIMARY_TAG="${REF_TAG}"
            EXTRA_TAGS="latest,${CLEAN_VER},${SHA_TAG}"
          fi
          mvn -B -ntp package -DskipTests \
            -Dquarkus.container-image.build=true \
            -Dquarkus.container-image.push=true \
            -Dquarkus.container-image.registry=docker.io \
            -Dquarkus.container-image.group="${DOCKERHUB_USERNAME}" \
            -Dquarkus.container-image.name=archlens \
            -Dquarkus.container-image.username="${DOCKERHUB_USERNAME}" \
            -Dquarkus.container-image.password="${DOCKERHUB_TOKEN}" \
            -Dquarkus.container-image.tag="${PRIMARY_TAG}" \
            -Dquarkus.container-image.additional-tags="${EXTRA_TAGS}"

      - name: Extract Release Notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Deterministic notes from the matching "## [x.y.z]" CHANGELOG section, so
          # workflow re-runs overwrite the body instead of appending duplicate notes.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::No CHANGELOG.md section for ${VERSION}; using a compare link only."
          fi
          printf '\n**Full Changelog**: [CHANGELOG.md](https://github.com/%s/blob/%s/CHANGELOG.md)\n' "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Archlens Release ${{ github.ref_name }}
          body_path: release-notes.md
          append_body: false
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'Alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'Beta') || contains(github.ref_name, 'rc') }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            backend/target/archlens-backend-*.jar
            backend/target/archlens-*-runner.tar.gz
            backend/target/bom.json
            backend/target/bom.xml
            media/archlens-teaser.mp4

  native-binaries:
    name: Build GraalVM Native Binary (linux-amd64)
    needs: [docker-release]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: local-archlens
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node & Maven Toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          setup-java: 'false'
          setup-maven: 'true'
          cache-pnpm: 'true'

      - name: Set up GraalVM / Mandrel 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'

      - name: Ensure Native C Toolchain (gcc & libz.so)
        shell: bash
        run: |
          mkdir -p "$HOME/.local/lib"
          SYS_LIBZ=$(find /usr/lib /lib -name "libz.so.1*" 2>/dev/null | head -n 1 || true)
          if [ -n "$SYS_LIBZ" ]; then
            ln -sf "$SYS_LIBZ" "$HOME/.local/lib/libz.so"
            echo "Linked $HOME/.local/lib/libz.so -> $SYS_LIBZ"
          fi
          echo "LIBRARY_PATH=$HOME/.local/lib" >> "$GITHUB_ENV"

      - name: Build GraalVM Native Executable (linux-amd64)
        shell: bash
        run: |
          mvn -B -ntp package -Pnative -DskipTests \
            -Dquarkus.native.native-image-xmx=3g \
            -Dquarkus.native.additional-build-args="-Ob,-J-XX:ActiveProcessorCount=2,-H:CLibraryPath=${HOME}/.local/lib"
          RUNNER_BIN=$(find backend/target -maxdepth 2 -type f -name "*-runner" 2>/dev/null | head -n 1 || true)
          if [ -z "$RUNNER_BIN" ]; then
            echo "::error::Native runner binary was not produced in backend/target"
            exit 1
          fi
          cp "$RUNNER_BIN" "backend/target/archlens-linux-amd64"
          chmod +x "backend/target/archlens-linux-amd64"

      - name: Attach Native Binary to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: backend/target/archlens-linux-amd64

  move-major-tag:
    name: Move Floating Major Tag (e.g. v1) for the GitHub Action
    needs: [docker-release]
    # Stable vX.Y.Z tags only; pre-releases (anything with a suffix) never move the major tag.
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: local-archlens
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Point the major tag at this release (#231)
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "Not a stable vX.Y.Z tag (${RELEASE_TAG}); leaving major tags alone."
            exit 0
          fi
          MAJOR_TAG="v${BASH_REMATCH[1]}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Pushed with GITHUB_TOKEN, so this does not trigger another release run.
          git tag -f "$MAJOR_TAG" "${RELEASE_TAG}^{commit}"
          git push -f origin "refs/tags/${MAJOR_TAG}"
          echo "${MAJOR_TAG} now points at ${RELEASE_TAG} ($(git rev-parse --short "${RELEASE_TAG}^{commit}"))."

  npm-release:
    name: Test and Publish NPM CLI Package
    needs: [verify-ci-gate]
    runs-on: local-archlens
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js (Latest LTS)
        uses: ./.github/actions/setup-toolchain
        with:
          setup-java: 'false'
          setup-maven: 'false'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify Agent Skills Sync & Manifest Parity
        run: node scripts/sync-skills.js --check

      - name: Run CLI & Script Unit Tests
        run: npm test

      - name: Pack CLI Package & Verify Bundled Skills
        id: pack
        run: |
          npm pack ./cli --pack-destination cli
          TARBALL_PATH=$(ls ./cli/fmatar-archlens-skill-*.tgz | head -n 1)
          TARBALL_FILES=$(tar -tzf "$TARBALL_PATH")
          if ! echo "$TARBALL_FILES" | grep -qx "package/skills/archlens/SKILL.md"; then
            echo "::error::Missing bundled skill package/skills/archlens/SKILL.md in $TARBALL_PATH"
            exit 1
          fi
          SKILL_COUNT=$(echo "$TARBALL_FILES" | grep -c '^package/skills/[^/]\+/SKILL\.md$' || true)
          if [ "$SKILL_COUNT" -ne 1 ]; then
            echo "::error::Expected exactly 1 bundled skill in $TARBALL_PATH, found $SKILL_COUNT"
            exit 1
          fi
          echo "tarball=${TARBALL_PATH}" >> "$GITHUB_OUTPUT"

      - name: Resolve Package Version
        id: meta
        run: |
          PKG_NAME=$(node -p "require('./cli/package.json').name")
          PKG_VERSION=$(node -p "require('./cli/package.json').version")
          echo "name=${PKG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]] && [ "${GITHUB_REF_NAME#v}" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match cli/package.json version ${PKG_VERSION}"
            exit 1
          fi

      # NOTE: --provenance and npm Trusted Publishing (OIDC) are only accepted by npm from
      # GitHub-hosted runners. This job runs on the self-hosted local-archlens ARC runners,
      # so publishing authenticates with the NPM_TOKEN secret and omits --provenance
      # (npm rejects self-hosted provenance with E422).
      # Only tag pushes (and manual dispatches) publish, so exactly one run publishes each
      # version (#233). Branch pushes to main run the same checks as a dry run.
      - name: Skip npm publish (branch push)
        if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}
        run: |
          echo "Branch push: package packed and tested; the v${{ steps.meta.outputs.version }} tag push publishes it."

      - name: Publish @fmatar/archlens-skill to Public NPM Registry
        if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PKG_NAME: ${{ steps.meta.outputs.name }}
          PKG_VERSION: ${{ steps.meta.outputs.version }}
          TARBALL_PATH: ${{ steps.pack.outputs.tarball }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN secret is not set; cannot publish to registry.npmjs.org from self-hosted runners."
            exit 1
          fi
          NPMRC="${RUNNER_TEMP}/.npmrc-npmjs"
          printf '@fmatar:registry=https://registry.npmjs.org/\n//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}\n' > "$NPMRC"
          export NPM_CONFIG_USERCONFIG="$NPMRC"
          NAME="${PKG_NAME}"
          VERSION="${PKG_VERSION}"
          SPEC="${NAME}@${VERSION}"
          if npm view "$SPEC" version --registry=https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "${SPEC} already on npmjs.org; ensuring the latest dist-tag points at it."
            npm dist-tag add "$SPEC" latest --registry=https://registry.npmjs.org/
          else
            npm publish "${TARBALL_PATH}" --access public --tag latest --registry=https://registry.npmjs.org/
          fi
          # The registry takes a while to serve a fresh version; poll with backoff instead of
          # failing on the first E404 (#233).
          node scripts/wait-for-npm-version.js "$NAME" "$VERSION" \
            --registry https://registry.npmjs.org/ --timeout-seconds 300
          npm view "$NAME" dist-tags --registry=https://registry.npmjs.org/ || true

      - name: Publish to GitHub Packages (Mirror)
        if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG_NAME: ${{ steps.meta.outputs.name }}
          PKG_VERSION: ${{ steps.meta.outputs.version }}
          TARBALL_PATH: ${{ steps.pack.outputs.tarball }}
        run: |
          NPMRC="${RUNNER_TEMP}/.npmrc-ghpkg"
          printf '@fmatar:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}\n' > "$NPMRC"
          export NPM_CONFIG_USERCONFIG="$NPMRC"
          SPEC="${PKG_NAME}@${PKG_VERSION}"
          if npm view "$SPEC" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "${SPEC} already on GitHub Packages; skipping."
            exit 0
          fi
          npm publish "${TARBALL_PATH}" --registry=https://npm.pkg.github.com --tag latest
