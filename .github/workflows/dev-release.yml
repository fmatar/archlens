name: Development Track (Canary) Release

on:
  push:
    branches:
      - develop
    paths-ignore:
      - '*.md'
      - 'wiki/**'
      - 'media/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-ci-gate:
    name: Wait for CI & Quality Gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Enforce Safe Dispatch Ref
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "$GITHUB_REF" != "refs/heads/develop" ]; then
            echo "::error::Canary dispatch is restricted to develop (got ${GITHUB_REF})."
            exit 1
          fi

      - name: Wait for CI & Quality Gates on Commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/wait-for-ci-checks.js \
            --repo "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" \
            --check "Verify & Quality Gates" \
            --check "GitHub Action Self-Test (uses ./)"

  dev-docker:
    name: Build & Publish Canary Docker Image (:dev)
    needs: [verify-ci-gate]
    runs-on: local-archlens
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Build Toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cache-pnpm: 'true'

      - name: Build and Push Canary Multi-Arch Container Image (Quarkus Jib)
        env:
          GHCR_PASSWORD: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
        run: |
          mvn -B -ntp package -DskipTests \
            -Dquarkus.container-image.build=true \
            -Dquarkus.container-image.push=true \
            -Dquarkus.container-image.registry=ghcr.io \
            -Dquarkus.container-image.group="${REPO_OWNER}" \
            -Dquarkus.container-image.name=archlens \
            -Dquarkus.container-image.username="${ACTOR}" \
            -Dquarkus.container-image.password="${GHCR_PASSWORD}" \
            -Dquarkus.container-image.tag="dev" \
            -Dquarkus.container-image.additional-tags="dev-${GITHUB_SHA::7}"

  dev-npm:
    name: Build & Publish Canary NPM Package (@dev)
    needs: [verify-ci-gate]
    runs-on: local-archlens
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js (Latest LTS)
        uses: ./.github/actions/setup-toolchain
        with:
          setup-java: 'false'
          setup-maven: 'false'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify Agent Skills Sync & Manifest Parity
        run: node scripts/sync-skills.js --check

      - name: Run CLI & Script Unit Tests
        run: npm test

      - name: Prepare Canary Prerelease Version
        id: versioning
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          BASE_VERSION=$(node -p "require('./cli/package.json').version.split('-')[0]")
          DEV_VERSION="${BASE_VERSION}-dev.${RUN_NUMBER}"
          echo "Setting package version to ${DEV_VERSION}"
          npm --prefix cli version "${DEV_VERSION}" --no-git-tag-version
          echo "canary_version=${DEV_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Pack Canary Package & Verify Bundled Skills
        id: pack
        run: |
          npm pack ./cli --pack-destination cli
          TARBALL_PATH=$(ls ./cli/fmatar-archlens-skill-*.tgz | head -n 1)
          TARBALL_FILES=$(tar -tzf "$TARBALL_PATH")
          for SKILL_MD in \
            package/skills/archlens/SKILL.md \
            package/skills/archlens-install-policy/SKILL.md \
            package/skills/uml-workbench-companion/SKILL.md; do
            if ! echo "$TARBALL_FILES" | grep -qx "$SKILL_MD"; then
              echo "::error::Missing bundled skill $SKILL_MD in $TARBALL_PATH"
              exit 1
            fi
          done
          echo "tarball=${TARBALL_PATH}" >> "$GITHUB_OUTPUT"

      # npm rejects --provenance (and Trusted Publishing/OIDC) from self-hosted runners,
      # and actions/setup-node overrides ~/.npmrc via NPM_CONFIG_USERCONFIG, so each
      # registry gets an explicit userconfig and failures are no longer swallowed.
      - name: Publish Canary to Public NPM Registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARBALL_PATH: ${{ steps.pack.outputs.tarball }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN secret is not set; cannot publish canary to registry.npmjs.org."
            exit 1
          fi
          NPMRC="${RUNNER_TEMP}/.npmrc-npmjs"
          printf '@fmatar:registry=https://registry.npmjs.org/\n//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}\n' > "$NPMRC"
          export NPM_CONFIG_USERCONFIG="$NPMRC"
          npm publish "${TARBALL_PATH}" --access public --tag dev --registry=https://registry.npmjs.org/

      - name: Publish Canary to GitHub Packages (Mirror)
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARBALL_PATH: ${{ steps.pack.outputs.tarball }}
        run: |
          NPMRC="${RUNNER_TEMP}/.npmrc-ghpkg"
          printf '@fmatar:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}\n' > "$NPMRC"
          export NPM_CONFIG_USERCONFIG="$NPMRC"
          npm publish "${TARBALL_PATH}" --registry=https://npm.pkg.github.com --tag dev
