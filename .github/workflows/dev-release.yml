name: Development Track (Canary) Release

on:
  push:
    branches:
      - develop
    paths-ignore:
      - '**.md'
      - 'media/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: dev-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dev-docker:
    name: Build & Publish Canary Docker Image (:dev)
    runs-on: local-archlens

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Maven
        run: |
          if ! command -v mvn >/dev/null 2>&1; then
            MAVEN_VER="3.9.9"
            MAVEN_DIR="$HOME/.local/apache-maven-${MAVEN_VER}"
            if [ ! -x "${MAVEN_DIR}/bin/mvn" ]; then
              mkdir -p "$HOME/.local"
              curl -fsSL "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VER}/binaries/apache-maven-${MAVEN_VER}-bin.tar.gz" | tar -xz -C "$HOME/.local"
            fi
            echo "${MAVEN_DIR}/bin" >> "$GITHUB_PATH"
          fi

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build and Push Canary Multi-Arch Container Image (Quarkus Jib)
        env:
          GHCR_PASSWORD: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          npm --prefix frontend install
          npm --prefix frontend run build
          mvn -B -ntp package -DskipTests \
            -Dquarkus.container-image.build=true \
            -Dquarkus.container-image.push=true \
            -Dquarkus.container-image.registry=ghcr.io \
            -Dquarkus.container-image.group=${{ github.repository_owner }} \
            -Dquarkus.container-image.name=archlens \
            -Dquarkus.container-image.username=${{ github.actor }} \
            -Dquarkus.container-image.password="${GHCR_PASSWORD}" \
            -Dquarkus.container-image.tag="dev" \
            -Dquarkus.container-image.additional-tags="dev-${GITHUB_SHA::7}"

  dev-npm:
    name: Build & Publish Canary NPM Package (@dev)
    runs-on: local-archlens

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Run CLI Tests
        run: |
          npm --prefix cli test

      - name: Prepare Canary Prerelease Version
        id: versioning
        run: |
          BASE_VERSION=$(node -p "require('./cli/package.json').version.split('-')[0]")
          DEV_VERSION="${BASE_VERSION}-dev.${{ github.run_number }}"
          echo "Setting package version to ${DEV_VERSION}"
          npm --prefix cli version "${DEV_VERSION}" --no-git-tag-version
          echo "canary_version=${DEV_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Pack Canary Package
        id: pack
        run: |
          npm pack cli --pack-destination cli
          TARBALL_PATH=$(ls cli/fmatar-archlens-skill-*.tgz | head -n 1)
          echo "tarball=${TARBALL_PATH}" >> "$GITHUB_OUTPUT"

      - name: Publish Canary to GitHub Packages
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" > ~/.npmrc
          echo "@fmatar:registry=https://npm.pkg.github.com" >> ~/.npmrc
          npm publish "${{ steps.pack.outputs.tarball }}" --tag dev || echo "GitHub Packages canary already published."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Canary to Public NPM Registry
        run: |
          echo "@fmatar:registry=https://registry.npmjs.org/" > ~/.npmrc
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" >> ~/.npmrc
            npm publish "${{ steps.pack.outputs.tarball }}" --access public --tag dev --provenance || echo "Notice: Canary already published or NPM error."
          else
            npm publish "${{ steps.pack.outputs.tarball }}" --access public --tag dev --provenance || echo "Notice: Set NPM_TOKEN or configure Trusted Publishing to publish canary to public npm."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
