name: 'Set up Archlens Build Toolchain'
description: 'Provisions latest Apache Maven (CDN + atomic install), Java 25, Node.js Latest LTS (lts/*), and caches on local-archlens'
inputs:
  setup-java:
    description: 'Whether to set up Java 25 (Temurin)'
    required: false
    default: 'true'
  setup-maven:
    description: 'Whether to set up Apache Maven'
    required: false
    default: 'true'
  setup-node:
    description: 'Whether to set up Node.js Latest LTS (lts/*)'
    required: false
    default: 'true'
  registry-url:
    description: 'Optional NPM registry URL for actions/setup-node'
    required: false
    default: ''
  cache-pnpm:
    description: 'Whether to cache Apache Maven, PNPM, and Quarkus Quinoa node binaries'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Cache Toolchain & PNPM Store
      if: inputs.cache-pnpm == 'true'
      uses: actions/cache@v6
      with:
        path: |
          ~/.local/apache-maven-*
          ~/.cache/archlens-node
          ~/.local/share/pnpm/store
          ~/.cache/ms-playwright
        key: ${{ runner.os }}-archlens-toolchain-${{ hashFiles('pom.xml', 'frontend/pom.xml', 'cli/pom.xml', 'frontend/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-archlens-toolchain-

    - name: Set up Latest Apache Maven
      if: inputs.setup-maven == 'true'
      shell: bash
      run: |
        EXISTING_MAVEN_DIR=$(ls -d "$HOME"/.local/apache-maven-3.9.* 2>/dev/null | sort -V | tail -n 1 || true)
        if [ -n "$EXISTING_MAVEN_DIR" ] && [ -x "${EXISTING_MAVEN_DIR}/bin/mvn" ]; then
          MAVEN_DIR="$EXISTING_MAVEN_DIR"
          MAVEN_VER="${EXISTING_MAVEN_DIR##*apache-maven-}"
        else
          METADATA_URL="https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/maven-metadata.xml"
          LATEST_MAVEN=$(curl -fsSL --retry 5 --retry-all-errors "$METADATA_URL" \
            | sed -n 's:.*<version>\(3\.9\.[0-9]*\)</version>.*:\1:p' \
            | tail -n 1 || true)
          MAVEN_VER="${LATEST_MAVEN:-3.9.16}"
          MAVEN_DIR="$HOME/.local/apache-maven-${MAVEN_VER}"

          if [ ! -x "${MAVEN_DIR}/bin/mvn" ]; then
            mkdir -p "$HOME/.local"
            TMP_DIR=$(mktemp -d "$HOME/.local/maven-tmp.XXXXXX")
            TAR_URL="https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/${MAVEN_VER}/apache-maven-${MAVEN_VER}-bin.tar.gz"
            SHA_URL="${TAR_URL}.sha512"
            TAR_FILE="${TMP_DIR}/apache-maven-${MAVEN_VER}-bin.tar.gz"
            curl -fsSL --retry 5 --retry-all-errors "$TAR_URL" -o "$TAR_FILE"
            EXPECTED_SHA=$(curl -fsSL --retry 5 --retry-all-errors "$SHA_URL" | awk '{print $1}')
            if [ -z "$EXPECTED_SHA" ]; then
              echo "::error::Empty SHA-512 checksum returned for Apache Maven ${MAVEN_VER}"
              rm -rf "$TMP_DIR"
              exit 1
            fi
            if command -v sha512sum >/dev/null 2>&1; then
              ACTUAL_SHA=$(sha512sum "$TAR_FILE" | awk '{print $1}')
            else
              ACTUAL_SHA=$(shasum -a 512 "$TAR_FILE" | awk '{print $1}')
            fi
            if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
              echo "::error::Apache Maven ${MAVEN_VER} SHA-512 verification failed (expected ${EXPECTED_SHA}, got ${ACTUAL_SHA})"
              rm -rf "$TMP_DIR"
              exit 1
            fi
            tar -xzf "$TAR_FILE" -C "$TMP_DIR"
            mv -n "$TMP_DIR/apache-maven-${MAVEN_VER}" "$MAVEN_DIR" || true
            rm -rf "$TMP_DIR"
          fi
        fi
        echo "${MAVEN_DIR}/bin" >> "$GITHUB_PATH"
        echo "MAVEN_OPTS=-Xmx1536m -Djdk.xml.maxGeneralEntitySizeLimit=0 -Djdk.xml.totalEntitySizeLimit=0" >> "$GITHUB_ENV"
        echo "Using Apache Maven ${MAVEN_VER} at ${MAVEN_DIR}/bin/mvn"

    - name: Set up Java 25
      if: inputs.setup-java == 'true'
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'maven'

    - name: Set up Node.js (Latest LTS)
      if: inputs.setup-node == 'true' && inputs.registry-url == ''
      uses: actions/setup-node@v7
      with:
        node-version: 'lts/*'

    - name: Set up Node.js (Latest LTS with Registry)
      if: inputs.setup-node == 'true' && inputs.registry-url != ''
      uses: actions/setup-node@v7
      with:
        node-version: 'lts/*'
        registry-url: ${{ inputs.registry-url }}

    - name: Ensure pnpm is Installed
      if: inputs.setup-node == 'true'
      shell: bash
      run: |
        if ! command -v pnpm >/dev/null 2>&1; then
          npm install -g pnpm
        fi
        echo "Using pnpm $(pnpm --version)"
