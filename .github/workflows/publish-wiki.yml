name: Publish Wiki Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'wiki/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-wiki
  cancel-in-progress: true

jobs:
  publish-wiki:
    runs-on: local-archlens
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Sync Wiki Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -d "wiki" ]; then
            echo "No wiki directory found. Skipping."
            exit 0
          fi
          
          TMP_DIR=$(mktemp -d)
          echo "Cloning wiki repository..."
          if git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.wiki.git" "$TMP_DIR"; then
            echo "Copying wiki pages..."
            cp -r wiki/* "$TMP_DIR/"
            cd "$TMP_DIR"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            if git diff --staged --quiet; then
              echo "No changes to commit in wiki."
            else
              git commit -m "docs: sync wiki pages from repository [skip ci]"
              git push origin master || git push origin main
            fi
            cd -
            rm -rf "$TMP_DIR"
          else
            echo "Wiki repository not initialized yet. Visit https://github.com/${{ github.repository }}/wiki to initialize."
          fi
