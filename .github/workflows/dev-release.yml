name: Development Track (Canary) Release

on:
  push:
    branches:
      - develop
    paths-ignore:
      - '*.md'
      - 'wiki/**'
      - 'media/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-ci-gate:
    name: Wait for CI & Quality Gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Enforce Safe Dispatch Ref
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "$GITHUB_REF" != "refs/heads/develop" ]; then
            echo "::error::Canary dispatch is restricted to develop (got ${GITHUB_REF})."
            exit 1
          fi

      - name: Wait for CI & Quality Gates on Commit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/wait-for-ci-checks.js \
            --repo "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" \
            --check "Verify & Quality Gates" \
            --check "Playwright E2E Browser Suite" \
            --check "GitHub Action Self-Test (uses ./)"

  dev-docker:
    name: Build & Publish Canary Docker Image (:dev)
    needs: [verify-ci-gate]
    runs-on: local-archlens
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Build Toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cache-pnpm: 'true'

      - name: Build and Push Canary Multi-Arch Container Image (Quarkus Jib)
        env:
          GHCR_PASSWORD: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          REPO_OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
        run: |
          mvn -B -ntp package -DskipTests \
            -Dquarkus.container-image.build=true \
            -Dquarkus.container-image.push=true \
            -Dquarkus.container-image.registry=ghcr.io \
            -Dquarkus.container-image.group="${REPO_OWNER}" \
            -Dquarkus.container-image.name=archlens \
            -Dquarkus.container-image.username="${ACTOR}" \
            -Dquarkus.container-image.password="${GHCR_PASSWORD}" \
            -Dquarkus.container-image.tag="dev" \
            -Dquarkus.container-image.additional-tags="dev-${GITHUB_SHA::7}"

  dev-npm:
    name: Build & Publish Canary NPM Package (@dev)
    needs: [verify-ci-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js (Latest LTS)
        uses: ./.github/actions/setup-toolchain
        with:
          setup-java: 'false'
          setup-maven: 'false'

      - name: Ensure npm >= 11.5.1 for OIDC Trusted Publishing
        run: |
          npm install -g npm@latest
          echo "Using npm $(npm --version)"

      - name: Verify Agent Skills Sync & Manifest Parity
        run: node scripts/sync-skills.js --check

      - name: Run CLI & Script Unit Tests
        run: npm test

      - name: Prepare Canary Prerelease Version
        id: versioning
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          BASE_VERSION=$(node -p "require('./cli/package.json').version.split('-')[0]")
          DEV_VERSION="${BASE_VERSION}-dev.${RUN_NUMBER}"
          echo "Setting package version to ${DEV_VERSION}"
          npm --prefix cli version "${DEV_VERSION}" --no-git-tag-version
          echo "canary_version=${DEV_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Pack Canary Package & Verify Bundled Skills
        id: pack
        run: |
          npm pack ./cli --pack-destination cli
          TARBALL_PATH=$(ls ./cli/fadym-archlens-skill-*.tgz | head -n 1)
          TARBALL_FILES=$(tar -tzf "$TARBALL_PATH")
          if ! echo "$TARBALL_FILES" | grep -qx "package/skills/archlens/SKILL.md"; then
            echo "::error::Missing bundled skill package/skills/archlens/SKILL.md in $TARBALL_PATH"
            exit 1
          fi
          SKILL_COUNT=$(echo "$TARBALL_FILES" | grep -c '^package/skills/[^/]\+/SKILL\.md$' || true)
          if [ "$SKILL_COUNT" -ne 1 ]; then
            echo "::error::Expected exactly 1 bundled skill in $TARBALL_PATH, found $SKILL_COUNT"
            exit 1
          fi
          echo "tarball=${TARBALL_PATH}" >> "$GITHUB_OUTPUT"

      # Uses npm OIDC Trusted Publishing (GitHub-hosted ubuntu-latest + id-token: write + npm >= 11.5.1)
      # with SLSA --provenance attestation; zero long-lived NPM_TOKEN secrets required.
      - name: Publish Canary to Public NPM Registry
        env:
          TARBALL_PATH: ${{ steps.pack.outputs.tarball }}
        run: |
          unset NODE_AUTH_TOKEN NPM_TOKEN NPM_CONFIG_USERCONFIG
          npm publish "${TARBALL_PATH}" --access public --tag dev --provenance --registry=https://registry.npmjs.org/
