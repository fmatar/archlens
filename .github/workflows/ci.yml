name: CI & Quality Gates

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Verify & Quality Gates
    runs-on: local-archlens

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Enforce Branch Flow Policy
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          if [ "${{ github.head_ref }}" != "develop" ]; then
            echo "::error::Branch policy violation: Pull requests targeting 'main' must originate exclusively from 'develop'. Direct merges from feature branches into 'main' are forbidden."
            exit 1
          fi

      - name: Set up Build Toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cache-pnpm: 'true'

      - name: Full Build, Spotless, Tests & Quality Gates
        run: mvn -B -ntp clean spotless:check verify

      - name: Run Frontend Type Check & Vitest Coverage Suite
        run: |
          npm --prefix frontend run check
          npm --prefix frontend run test:coverage

      - name: Run CLI & Script Unit Tests
        run: npm test

      - name: End-to-End Packaged Workbench & MCP Smoke Test
        run: npm run smoke

      - name: Archlens Clean Architecture Conformance Gate
        run: node cli/bin/index.js check --path . --max-violations 0 --detect-cycles --screaming-threshold 0.70 --fitness-threshold 0.85 --format sarif --output archlens-results.sarif

      - name: Upload Architecture SARIF Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: archlens-sarif-report
          path: archlens-results.sarif
          retention-days: 14

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jacoco-coverage
          path: backend/target/site/jacoco/
          retention-days: 14

      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cyclonedx-sbom
          path: backend/target/bom.json
          retention-days: 14

      - name: Generate Consolidated Full-Stack Report
        if: always()
        run: |
          node scripts/generate-report.js
          if [ -f reports/summary.md ]; then
            cat reports/summary.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Consolidated Health Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: full-stack-health-report
          path: reports/
          retention-days: 14

