name: CI & Quality Gates

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Verify & Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Enforce Branch Flow Policy
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          if [ "${{ github.head_ref }}" != "develop" ]; then
            echo "::error::Branch policy violation: Pull requests targeting 'main' must originate exclusively from 'develop'. Direct merges from feature branches into 'main' are forbidden."
            exit 1
          fi

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Spotless & Enforcer Checks
        run: mvn -B -ntp spotless:check validate

      - name: Full Build, Tests & Quality Gates
        run: mvn -B -ntp clean verify

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jacoco-coverage
          path: backend/target/site/jacoco/
          retention-days: 14
