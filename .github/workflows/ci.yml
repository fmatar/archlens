name: CI & Quality Gates

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify & Quality Gates
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: local-archlens
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Enforce Branch Flow Policy
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REF" != "develop" ] || [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "::error::Branch policy violation: Pull requests targeting 'main' must originate exclusively from 'develop' in ${BASE_REPO}. Direct or fork merges from '${HEAD_REPO}:${HEAD_REF}' into 'main' are forbidden."
            exit 1
          fi

      - name: Set up Build Toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cache-pnpm: 'true'

      - name: Full Build, Spotless, Tests & Quality Gates
        run: mvn -B -ntp clean spotless:check verify

      - name: Run Frontend Type Check & Vitest Coverage Suite
        run: |
          pnpm --dir frontend run check
          pnpm --dir frontend run test:coverage

      - name: Install Playwright Headless Chromium & Linux Runtime Libraries
        run: |
          pnpm --dir frontend exec playwright install --only-shell chromium
          bash scripts/ensure-playwright-linux-libs.sh

      - name: Run Frontend Playwright E2E Browser Suite
        run: pnpm --dir frontend run test:e2e

      - name: Verify Agent Skills Sync & npx skills Manifest Parity
        run: npm run skills:check

      - name: Run CLI & Script Unit Tests
        run: npm test

      - name: End-to-End Packaged Workbench & MCP Smoke Test
        run: npm run smoke

      - name: Archlens Clean Architecture Conformance Gate
        run: node cli/bin/index.js check --path . --max-violations 0 --detect-cycles --screaming-threshold 0.70 --fitness-threshold 0.85 --format sarif --output archlens-results.sarif

      # Publish the Archlens findings to the Security tab / PR annotations (#236). Skipped for
      # fork PRs, which do not get security-events: write.
      - name: Upload Architecture SARIF to Code Scanning
        if: always() && hashFiles('archlens-results.sarif') != '' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: archlens-results.sarif
          category: archlens-clean-architecture

      - name: Upload Architecture SARIF Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: archlens-sarif-report
          path: archlens-results.sarif
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jacoco-coverage
          path: backend/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cyclonedx-sbom
          path: backend/target/bom.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Generate Consolidated Full-Stack Report
        if: always()
        run: |
          node scripts/generate-report.js
          if [ -f reports/summary.md ]; then
            cat reports/summary.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Consolidated Health Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: full-stack-health-report
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

  action-self-test:
    name: GitHub Action Self-Test (uses ./)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: local-archlens
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # Paths contain spaces on purpose: inputs must reach the CLI verbatim (#230).
      - name: Action passes on a conforming fixture
        uses: ./
        with:
          path: 'action/fixtures/conforming app'
          max-violations: '0'
          detect-cycles: 'true'
          sarif-file: 'action self-test/conforming.sarif'
          upload-sarif: 'false'

      - name: Action fails on a violating fixture
        id: violating
        continue-on-error: true
        uses: ./
        with:
          path: 'action/fixtures/violating app'
          max-violations: '0'
          detect-cycles: 'true'
          sarif-file: 'action self-test/violating.sarif'
          upload-sarif: 'false'

      - name: Assert gate outcomes
        env:
          VIOLATING_OUTCOME: ${{ steps.violating.outcome }}
        run: |
          test -s "action self-test/conforming.sarif"
          if [ "$VIOLATING_OUTCOME" != "failure" ]; then
            echo "::error::The Action did not fail on the violating fixture (outcome: $VIOLATING_OUTCOME)"
            exit 1
          fi
          node -e "const s=JSON.parse(require('fs').readFileSync('action self-test/violating.sarif','utf8')); if (!s.runs[0].results.length) process.exit(1)"
          echo "Action self-test passed: conforming fixture green, violating fixture red."
