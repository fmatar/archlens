name: CI & Quality Gates

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Verify & Quality Gates
    runs-on: local-archlens

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Enforce Branch Flow Policy
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: |
          if [ "${{ github.head_ref }}" != "develop" ]; then
            echo "::error::Branch policy violation: Pull requests targeting 'main' must originate exclusively from 'develop'. Direct merges from feature branches into 'main' are forbidden."
            exit 1
          fi

      - name: Set up Maven
        run: |
          if ! command -v mvn >/dev/null 2>&1; then
            MAVEN_VER="3.9.9"
            MAVEN_DIR="$HOME/.local/apache-maven-${MAVEN_VER}"
            if [ ! -x "${MAVEN_DIR}/bin/mvn" ]; then
              mkdir -p "$HOME/.local"
              curl -fsSL "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VER}/binaries/apache-maven-${MAVEN_VER}-bin.tar.gz" | tar -xz -C "$HOME/.local"
            fi
            echo "${MAVEN_DIR}/bin" >> "$GITHUB_PATH"
          fi

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Cache Node and Toolchain Binaries
        uses: actions/cache@v4
        with:
          path: |
            frontend/node
            cli/node
          key: ${{ runner.os }}-node-binaries-${{ hashFiles('pom.xml', 'frontend/pom.xml', 'cli/pom.xml') }}

      - name: Cache PNPM Store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Spotless & Enforcer Checks
        run: mvn -B -ntp spotless:check validate

      - name: Full Build, Tests & Quality Gates
        run: mvn -B -ntp clean verify

      - name: Archlens Clean Architecture Conformance Gate
        run: node cli/bin/index.js check --path . --max-violations 0 --format sarif --output archlens-results.sarif

      - name: Upload Architecture SARIF Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: archlens-sarif-report
          path: archlens-results.sarif
          retention-days: 14

      - name: Upload JaCoCo Coverage Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jacoco-coverage
          path: backend/target/site/jacoco/
          retention-days: 14

      - name: Upload CycloneDX SBOM
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cyclonedx-sbom
          path: backend/target/bom.json
          retention-days: 14

      - name: Generate Consolidated Full-Stack Report
        if: always()
        run: |
          node scripts/generate-report.js
          if [ -f reports/summary.md ]; then
            cat reports/summary.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Consolidated Health Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: full-stack-health-report
          path: reports/
          retention-days: 14

