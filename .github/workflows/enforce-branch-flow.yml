name: Enforce Branch Flow Policy

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: enforce-branch-flow-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  enforce-develop-source:
    name: Enforce Merge From Develop Only
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate Pull Request Source Branch
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          echo "Target branch (base): ${BASE_REPO}:${BASE_REF}"
          echo "Source branch (head): ${HEAD_REPO}:${HEAD_REF}"
          if [ "$HEAD_REF" != "develop" ] || [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "::error::Branch policy violation: Pull requests targeting 'main' must originate exclusively from 'develop' in ${BASE_REPO}. Direct or fork merges from '${HEAD_REPO}:${HEAD_REF}' into 'main' are forbidden."
            exit 1
          fi
          echo "Branch policy validated: PR originates from '${BASE_REPO}:develop'."
