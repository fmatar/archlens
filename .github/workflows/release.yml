name: Publish Docker Image & Production Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
    paths-ignore:
      - '**.md'
      - 'media/**'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v1.1.0)'
        required: false
        default: 'v1.1.0'

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker-release:
    name: Build Multi-Arch Docker Image & Publish to GHCR
    runs-on: local-archlens

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Build Toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          cache-pnpm: 'true'

      - name: Build and Push Multi-Arch Container Image (Quarkus Jib)
        env:
          GHCR_PASSWORD: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          SHA_TAG="sha-${GITHUB_SHA::7}"
          REF_TAG="${{ github.ref_name }}"
          if [ "$REF_TAG" = "main" ]; then
            PRIMARY_TAG="latest"
            EXTRA_TAGS="${SHA_TAG}"
          else
            CLEAN_VER="${REF_TAG#v}"
            PRIMARY_TAG="${REF_TAG}"
            EXTRA_TAGS="latest,${CLEAN_VER},${SHA_TAG}"
          fi
          mvn -B -ntp package -DskipTests \
            -Dquarkus.container-image.build=true \
            -Dquarkus.container-image.push=true \
            -Dquarkus.container-image.registry=ghcr.io \
            -Dquarkus.container-image.group=${{ github.repository_owner }} \
            -Dquarkus.container-image.name=archlens \
            -Dquarkus.container-image.username=${{ github.actor }} \
            -Dquarkus.container-image.password="${GHCR_PASSWORD}" \
            -Dquarkus.container-image.tag="${PRIMARY_TAG}" \
            -Dquarkus.container-image.additional-tags="${EXTRA_TAGS}"
          tar -czf "backend/target/archlens-${{ github.ref_name }}-runner.tar.gz" -C backend/target quarkus-app

      - name: Publish Multi-Arch Container Image to Docker Hub (Optional)
        if: env.DOCKERHUB_TOKEN != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || github.repository_owner }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          SHA_TAG="sha-${GITHUB_SHA::7}"
          REF_TAG="${{ github.ref_name }}"
          if [ "$REF_TAG" = "main" ]; then
            PRIMARY_TAG="latest"
            EXTRA_TAGS="${SHA_TAG}"
          else
            CLEAN_VER="${REF_TAG#v}"
            PRIMARY_TAG="${REF_TAG}"
            EXTRA_TAGS="latest,${CLEAN_VER},${SHA_TAG}"
          fi
          mvn -B -ntp package -DskipTests \
            -Dquarkus.container-image.build=true \
            -Dquarkus.container-image.push=true \
            -Dquarkus.container-image.registry=docker.io \
            -Dquarkus.container-image.group="${DOCKERHUB_USERNAME}" \
            -Dquarkus.container-image.name=archlens \
            -Dquarkus.container-image.username="${DOCKERHUB_USERNAME}" \
            -Dquarkus.container-image.password="${DOCKERHUB_TOKEN}" \
            -Dquarkus.container-image.tag="${PRIMARY_TAG}" \
            -Dquarkus.container-image.additional-tags="${EXTRA_TAGS}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Archlens Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'Alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'Beta') || contains(github.ref_name, 'rc') }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            backend/target/archlens-backend-*.jar
            backend/target/archlens-*-runner.tar.gz
            backend/target/bom.json
            backend/target/bom.xml
            media/archlens-teaser.mp4

  native-binaries:
    name: Build GraalVM Native Binary (linux-amd64)
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: local-archlens
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node & Maven Toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          setup-java: 'false'
          setup-maven: 'true'
          cache-pnpm: 'true'

      - name: Set up GraalVM / Mandrel 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'

      - name: Ensure Native C Toolchain (gcc & zlib)
        shell: bash
        run: |
          MISSING_PKGS=""
          command -v gcc >/dev/null 2>&1 || MISSING_PKGS="$MISSING_PKGS gcc libc6-dev"
          [ -f /usr/include/zlib.h ] || MISSING_PKGS="$MISSING_PKGS zlib1g-dev"
          if [ -n "$MISSING_PKGS" ] && sudo -n true 2>/dev/null; then
            sudo -n DEBIAN_FRONTEND=noninteractive apt-get update -qq
            sudo -n DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends $MISSING_PKGS || true
          fi

      - name: Build GraalVM Native Executable (linux-amd64)
        shell: bash
        run: |
          mvn -B -ntp package -Pnative -DskipTests
          RUNNER_BIN=$(find backend/target -maxdepth 2 -type f -name "*-runner" 2>/dev/null | head -n 1 || true)
          if [ -z "$RUNNER_BIN" ]; then
            echo "::error::Native runner binary was not produced in backend/target"
            exit 1
          fi
          cp "$RUNNER_BIN" "backend/target/archlens-linux-amd64"
          chmod +x "backend/target/archlens-linux-amd64"

      - name: Attach Native Binary to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: backend/target/archlens-linux-amd64

  npm-release:
    name: Test and Publish NPM CLI Package
    runs-on: local-archlens
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Node.js (Latest LTS)
        uses: ./.github/actions/setup-toolchain
        with:
          setup-java: 'false'
          setup-maven: 'false'
          registry-url: 'https://registry.npmjs.org'

      - name: Run CLI Tests
        run: |
          npm --prefix cli test

      - name: Pack CLI Package
        id: pack
        run: |
          npm pack ./cli --pack-destination cli
          TARBALL_PATH=$(ls ./cli/fmatar-archlens-skill-*.tgz | head -n 1)
          echo "tarball=${TARBALL_PATH}" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Packages
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" > ~/.npmrc
          echo "@fmatar:registry=https://npm.pkg.github.com" >> ~/.npmrc
          npm publish "${{ steps.pack.outputs.tarball }}" --tag latest || echo "GitHub Packages publication completed or version already published."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish @fmatar/archlens-skill to Public NPM Registry
        run: |
          echo "@fmatar:registry=https://registry.npmjs.org/" > ~/.npmrc
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" >> ~/.npmrc
            npm publish "${{ steps.pack.outputs.tarball }}" --access public --tag latest --provenance || echo "Notice: Package version already published to npm or registry rejected request."
          else
            npm publish "${{ steps.pack.outputs.tarball }}" --access public --tag latest --provenance || echo "Notice: Set NPM_TOKEN or configure Trusted Publishing to publish to public npm."
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

